name: Verify PhishGuard
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify standard-library runtime
        run: python -m unittest discover -s tests -v
      - name: Check JavaScript syntax
        run: |
          node --check static/app.js
          node --check extension/popup.js
  production-adapters:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: phishguard_test
          POSTGRES_USER: phishguard_test
          POSTGRES_PASSWORD: ephemeral_ci_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U phishguard_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://phishguard_test:ephemeral_ci_only@127.0.0.1:5432/phishguard_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
