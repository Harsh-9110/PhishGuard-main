[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phishguard"
version = "0.2.0"
description = "PhishGuard phishing website detection application"
requires-python = ">=3.12,<3.13"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools]
py-modules = [
    "app", "connect_db", "feature_extraction", "main",
    "ml_models", "models", "utils", "web_scraper", "service",
]
